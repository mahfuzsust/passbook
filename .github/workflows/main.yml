name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Build
        run: task build

      - name: Test
        run: task test

  tag-release:
    name: Tag release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          MAIN_VER=$(grep -oE 'version = "[^"]+"' cmd/passbook/main.go | head -1 | cut -d'"' -f2 || true)
          MAIN_VER="${MAIN_VER#v}"

          LATEST_TAG=$(git tag -l "v[0-9]*" | sort -V | tail -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          fi

          is_greater() {
            [ "$1" != "$2" ] && [ "$(printf "%s\n%s" "$1" "$2" | sort -V | tail -n1)" = "$1" ]
          }

          if [ -n "$LATEST_TAG" ]; then
            BASE_VERSION="${LATEST_TAG#v}"
            BASE_VERSION="${BASE_VERSION%%-*}"

            if [ -n "$MAIN_VER" ] && is_greater "$MAIN_VER" "$BASE_VERSION" && ! git rev-parse "refs/tags/v${MAIN_VER}" >/dev/null 2>&1; then
              TAG="v${MAIN_VER}"
            else
              IFS='.' read -r major minor patch <<< "$BASE_VERSION"
              if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]; then
                echo "Invalid base version: ${BASE_VERSION}"
                exit 1
              fi
              NEXT_VERSION="${major}.${minor}.$((patch + 1))"
              TAG="v${NEXT_VERSION}"
            fi
          else
            if [ -n "$MAIN_VER" ]; then
              TAG="v${MAIN_VER}"
            else
              TAG="v0.1.0"
            fi
          fi

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Created ${TAG} (from latest tag ${LATEST_TAG:-none}, base ${BASE_VERSION:-none})"

      - name: Trigger release workflow
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml --ref "${{ steps.tag.outputs.tag }}"
