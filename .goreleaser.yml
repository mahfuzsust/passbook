version: 2

project_name: passbook

before:
  hooks:
    - go mod tidy

builds:
  - id: linux-amd64
    main: ./cmd/passbook
    binary: passbook
    skip: '{{ and (isEnvSet "GORELEASER_GOOS") (ne .Env.GORELEASER_GOOS "linux") }}'
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: linux-arm64
    main: ./cmd/passbook
    binary: passbook
    skip: '{{ and (isEnvSet "GORELEASER_GOOS") (ne .Env.GORELEASER_GOOS "linux") }}'
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - CXX=aarch64-linux-gnu-g++
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: darwin-amd64
    main: ./cmd/passbook
    binary: passbook
    skip: '{{ and (isEnvSet "GORELEASER_GOOS") (ne .Env.GORELEASER_GOOS "darwin") }}'
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: darwin-arm64
    main: ./cmd/passbook
    binary: passbook
    skip: '{{ and (isEnvSet "GORELEASER_GOOS") (ne .Env.GORELEASER_GOOS "darwin") }}'
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: windows-amd64
    main: ./cmd/passbook
    binary: passbook
    skip: '{{ and (isEnvSet "GORELEASER_GOOS") (ne .Env.GORELEASER_GOOS "windows") }}'
    env:
      - CGO_ENABLED=1
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    builds:
      - linux-amd64
      - linux-arm64
      - darwin-amd64
      - darwin-arm64
      - windows-amd64
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  disable: true

release:
  github:
    owner: mahfuzsust
    name: passbook
  draft: false
  prerelease: false

brews:
  - name: passbook
    ids:
      - default
    skip_upload: false
    goarm64: "v8.0"
    repository:
      owner: mahfuzsust
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "chore: update passbook to {{ .Tag }}"
    directory: Formula
    homepage: "https://github.com/mahfuzsust/passbook"
    description: "Terminal-based password manager built in Go"
    license: "MIT"
    install: |
      bin.install "passbook"
    test: |
      system "#{bin}/passbook", "--version"
